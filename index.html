<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>아테님 이마로 계란 까기</title>
  <style>
    :root {
      --ink: #392719;
      --paper: rgba(255,255,255,.88);
      --orange: #ff9d20;
      --orange-dark: #ac5214;
      --shadow: rgba(86, 54, 24, .22);
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      background:
        radial-gradient(circle at 16% 17%, rgba(255,255,255,.86), rgba(255,255,255,0) 18%),
        radial-gradient(circle at 84% 12%, rgba(255,247,194,.62), rgba(255,247,194,0) 18%),
        linear-gradient(135deg, #ffe7a8 0%, #ffd0a0 45%, #b7eedc 100%);
    }

    #stage {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }

    canvas {
      display: block;
      width: min(100vw, 1280px);
      height: auto;
      max-height: 100vh;
      aspect-ratio: 16 / 9;
      border-radius: clamp(0px, 2.1vw, 28px);
      box-shadow: 0 24px 70px rgba(93, 58, 24, .22);
      touch-action: manipulation;
      cursor: pointer;
      background: transparent;
    }

    .overlay {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 20px;
      pointer-events: none;
    }

    .hidden { display: none !important; }

    .bgm-toggle {
      position: fixed;
      top: max(16px, env(safe-area-inset-top));
      right: max(16px, env(safe-area-inset-right));
      z-index: 20;
      padding: 10px 14px;
      font-size: 14px;
      line-height: 1;
      color: #61320d;
      background: rgba(255,255,255,.92);
      border: 2px solid rgba(255, 177, 62, .46);
      box-shadow: 0 5px 0 rgba(172, 82, 20, .75), 0 12px 26px rgba(86, 54, 24, .15);
    }

    .bgm-toggle.off {
      opacity: .65;
      filter: grayscale(.35);
    }

    .ready-layer {
      z-index: 18;
      background: rgba(255, 236, 176, .18);
      backdrop-filter: blur(1px);
    }

    .ready-bubble {
      pointer-events: none;
      padding: 28px 52px 32px;
      border-radius: 34px;
      background: rgba(255,255,255,.92);
      border: 3px solid rgba(255, 170, 43, .52);
      box-shadow: 0 20px 70px rgba(104, 66, 26, .22);
      color: #e46d11;
      font-size: clamp(58px, 12vw, 116px);
      font-weight: 1000;
      letter-spacing: -0.06em;
      text-shadow: 0 5px 0 rgba(255, 219, 132, .75);
      animation: readyPop .86s ease both;
    }

    @keyframes readyPop {
      0% { transform: scale(.72); opacity: 0; }
      35% { transform: scale(1.08); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }

    .card {
      width: min(92vw, 560px);
      padding: 30px 30px 28px;
      border-radius: 30px;
      text-align: center;
      background: var(--paper);
      border: 2px solid rgba(255,255,255,.74);
      backdrop-filter: blur(16px);
      box-shadow: 0 22px 70px rgba(104, 66, 26, .20);
      pointer-events: auto;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 8px 14px;
      margin-bottom: 13px;
      border-radius: 999px;
      font-weight: 900;
      color: #7d3e0c;
      background: #fff2bd;
      border: 2px solid rgba(255, 185, 62, .48);
    }

    h1 {
      margin: 0;
      font-size: clamp(34px, 5.5vw, 52px);
      line-height: 1.08;
      letter-spacing: -0.055em;
      word-break: keep-all;
    }

    p {
      margin: 14px 0 22px;
      font-size: 16px;
      line-height: 1.55;
      word-break: keep-all;
    }

    button {
      appearance: none;
      border: 0;
      border-radius: 999px;
      padding: 16px 34px;
      font-size: 20px;
      font-weight: 950;
      color: #fff;
      background: linear-gradient(180deg, #ffa72a, #f28316);
      box-shadow: 0 10px 0 var(--orange-dark), 0 18px 38px rgba(242, 131, 22, .24);
      cursor: pointer;
      transition: transform .12s ease, box-shadow .12s ease, filter .12s ease;
    }

    button:hover { filter: brightness(1.03); }

    button:active {
      transform: translateY(7px);
      box-shadow: 0 3px 0 var(--orange-dark), 0 10px 22px rgba(242, 131, 22, .22);
    }

    button.secondary {
      margin-top: 10px;
      padding: 11px 22px;
      font-size: 15px;
      color: #744116;
      background: rgba(255,255,255,.86);
      border: 2px solid rgba(255, 169, 54, .46);
      box-shadow: none;
    }

    input {
      width: 100%;
      height: 56px;
      margin: 18px 0 16px;
      border: 3px solid #ff8a1d;
      border-radius: 18px;
      padding: 0 18px;
      font-size: 19px;
      font-weight: 900;
      text-align: center;
      color: var(--ink);
      background: rgba(255,255,255,.96);
      outline: none;
    }


    .login-status {
      margin: 14px auto 18px;
      padding: 11px 14px;
      width: fit-content;
      max-width: 100%;
      border-radius: 999px;
      background: rgba(255, 242, 189, .74);
      color: rgba(76, 47, 25, .78);
      font-weight: 900;
      line-height: 1.35;
      word-break: keep-all;
    }

    .login-actions {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    .scoreline {
      margin: 10px 0 4px;
      color: #e06912;
      font-size: 28px;
      font-weight: 950;
    }

    .rank-list {
      margin: 18px 0 12px;
      padding: 0;
      list-style: none;
      text-align: left;
      max-height: 310px;
      overflow: auto;
    }

    .rank-list li {
      display: grid;
      grid-template-columns: 46px 1fr 70px;
      gap: 10px;
      align-items: center;
      padding: 11px 13px;
      margin: 8px 0;
      border-radius: 16px;
      background: rgba(255,255,255,.78);
      font-weight: 900;
    }

    .rank-list li.me {
      outline: 3px solid rgba(255, 165, 40, .72);
      background: #fff1bf;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      max-width: min(92vw, 520px);
      padding: 12px 16px;
      border-radius: 999px;
      background: rgba(255,255,255,.92);
      color: rgba(57,39,25,.76);
      font-weight: 800;
      box-shadow: 0 12px 40px rgba(80, 52, 24, .18);
      pointer-events: none;
    }

    @media (max-width: 560px) {
      .card {
        width: min(94vw, 540px);
        padding: 26px 22px 24px;
        border-radius: 26px;
      }

      h1 { font-size: clamp(30px, 9vw, 44px); }

      p { font-size: 14px; }

      button {
        padding: 15px 28px;
        font-size: 18px;
      }
    }
  </style>
</head>
<body>
  <main id="stage">
    <canvas id="game" width="1280" height="720" aria-label="계란 이마 챌린지 게임 화면"></canvas>
  </main>

  <button id="bgmToggle" class="bgm-toggle" type="button" aria-pressed="true" aria-label="BGM 켜기 또는 끄기">🔊 BGM</button>

  <section class="overlay ready-layer hidden" id="readyOverlay" aria-live="assertive">
    <div class="ready-bubble">준비!</div>
  </section>

  <section class="overlay" id="startOverlay" aria-live="polite">
    <div class="card">
      <div class="badge">🥚 계란을 까묵자!</div>
      <h1>아테 이마에 계란까기</h1>
      <p>아테님을 클릭하면 계란으로 이마를 깝니다.<br />30초 동안 최대한 많이 까보세요.</p>
      <p class="login-status" id="authStatus">치지직 로그인 확인 중...</p>
      <div class="login-actions">
        <button id="startBtn" type="button">게임 시작</button>
        <button id="loginBtn" class="secondary" type="button">치지직 로그인</button>
        <button id="logoutBtn" class="secondary hidden" type="button">로그아웃</button>
      </div>
    </div>
  </section>

  <section class="overlay hidden" id="nameOverlay" aria-live="polite">
    <div class="card">
      <div class="badge">⏱️ 게임 종료</div>
      <h1>기록 완료!</h1>
      <div class="scoreline" id="finalScoreText">0개</div>
      <p class="login-status" id="submitStatus">치지직 계정으로 랭킹 등록 중...</p>
      <button id="saveRankBtn" class="secondary" type="button">다시 등록 시도</button>
    </div>
  </section>

  <section class="overlay hidden" id="rankOverlay" aria-live="polite">
    <div class="card">
      <div class="badge">🏆 TOP 10</div>
      <h1>랭킹</h1>
      <ol class="rank-list" id="rankList"></ol>
      <button id="againBtn" type="button">다시 하기</button>
      <button id="refreshRankBtn" class="secondary" type="button">랭킹 새로고침</button>
    </div>
  </section>

  <div id="toast" class="toast hidden"></div>

  <script type="module">
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const W = canvas.width;
    const H = canvas.height;

    const startOverlay = document.getElementById('startOverlay');
    const readyOverlay = document.getElementById('readyOverlay');
    const nameOverlay = document.getElementById('nameOverlay');
    const rankOverlay = document.getElementById('rankOverlay');
    const startBtn = document.getElementById('startBtn');
    const bgmToggle = document.getElementById('bgmToggle');
    const saveRankBtn = document.getElementById('saveRankBtn');
    const againBtn = document.getElementById('againBtn');
    const refreshRankBtn = document.getElementById('refreshRankBtn');
    const loginBtn = document.getElementById('loginBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    const authStatus = document.getElementById('authStatus');
    const submitStatus = document.getElementById('submitStatus');
    const finalScoreText = document.getElementById('finalScoreText');
    const rankList = document.getElementById('rankList');
    const toast = document.getElementById('toast');

    const GAME_SECONDS = 30;
    const FLOOR_Y = 650;
    // activeDebris는 방금 깨져서 날아가는 조각만 보관합니다.
    // 바닥에 멈춘 조각은 floorLitter로 옮겨서 새 이펙트가 절대 삭제되지 않게 합니다.
    const MAX_ACTIVE_DEBRIS = 360;
    const MAX_FLOOR_LITTER = 220;
    const ACTIVE_SAFE_MS = 1200;
    const ASSET = './assets/';
    const SOUND = './assets/sounds/';

    // Cloudflare Worker 주소입니다. Worker 이름/계정이 바뀌면 이 값만 수정하세요.
    const WORKER_BASE = 'https://egg-chzzk-auth.jis127.workers.dev';
    const SESSION_KEY = 'egg-forehead-chzzk-session-v1';

    const SOURCE = { w: 3000, h: 2000 };

    // 핵심: 기본자세.png와 계란 맞는 모습.sprite.png 모두 같은 3:2 원본 프레임 기준으로 그립니다.
    // 그래서 기본자세와 맞는 모션의 크기/위치가 달라지지 않습니다.
    const HIT_SPRITE = { frameW: 900, frameH: 600, frames: 10, frameMs: 40 };
    const PEELED_SPRITE = { frameW: 180, frameH: 180, frames: 3, frameMs: 40 };

    const paths = {
      idle: ASSET + '기본자세.png',
      hitSprite: ASSET + '계란 맞는 모습.sprite.png',
      eggTop: ASSET + '계란 안깐거 - 윗부분.png',
      eggBottom: ASSET + '계란 안깐거 - 아래부분.png',
      peeledSprite: ASSET + '깐계란.sprite.png'
    };

    const images = {};
    const projectiles = [];
    const debris = [];
    const floorLitter = [];
    const impactMarks = [];

    let state = 'loading';
    let score = 0;
    let startAt = 0;
    let now = performance.now();
    let prev = now;
    let hitAnimStart = -Infinity;
    let lastSavedId = null;
    let readyTimer = null;

    let bgmEnabled = true;
    let introAttempted = false;
    let currentHitSound = null;
    const sounds = {};

    const char = {
      x: 190,
      y: 48,
      w: 945,
      h: 630,
      // 이마 충돌 지점을 기존보다 살짝 왼쪽으로 이동했습니다.
      foreheadSourceX: 1380,
      foreheadSourceY: 585,
      visibleBBox: { x1: 478, y1: 49, x2: 2332, y2: 1916 }
    };

    const auth = {
      loading: true,
      session: '',
      user: null
    };


    function show(el) { el.classList.remove('hidden'); }
    function hide(el) { el.classList.add('hidden'); }

    function say(text) {
      toast.textContent = text;
      show(toast);
      clearTimeout(say.timer);
      say.timer = setTimeout(() => hide(toast), 1600);
    }

    function setupAudio() {
      sounds.open = new Audio(SOUND + '카캇.mp3');
      sounds.bgm = new Audio(SOUND + 'Cats on Mars.mp3');
      sounds.ready = new Audio(SOUND + '준비.mp3');
      sounds.finish = new Audio(SOUND + '쯔아아아앗_Vocals.mp3');
      sounds.hit = [
        new Audio(SOUND + '안됏_Vocals.mp3'),
        new Audio(SOUND + '치_Vocals.mp3'),
        new Audio(SOUND + '흐에에에_Vocals.mp3')
      ];

      sounds.bgm.loop = true;
      sounds.bgm.volume = 0.42;
      sounds.open.volume = 0.82;
      sounds.ready.volume = 0.90;
      sounds.finish.volume = 0.92;
      for (const h of sounds.hit) h.volume = 0.86;

      for (const a of [sounds.open, sounds.bgm, sounds.ready, sounds.finish, ...sounds.hit]) {
        a.preload = 'auto';
      }
    }

    function safePlay(audioEl) {
      if (!audioEl) return Promise.resolve(false);
      try {
        const result = audioEl.play();
        if (result && typeof result.catch === 'function') {
          return result.then(() => true).catch(err => {
            console.debug('[audio play blocked]', err && err.name ? err.name : err);
            return false;
          });
        }
        return Promise.resolve(true);
      } catch (err) {
        console.debug('[audio play failed]', err);
        return Promise.resolve(false);
      }
    }

    function replay(audioEl) {
      if (!audioEl) return Promise.resolve(false);
      try {
        audioEl.pause();
        audioEl.currentTime = 0;
      } catch (_) {}
      return safePlay(audioEl);
    }

    function updateBgmButton() {
      bgmToggle.classList.toggle('off', !bgmEnabled);
      bgmToggle.setAttribute('aria-pressed', String(bgmEnabled));
      bgmToggle.textContent = bgmEnabled ? '🔊 BGM' : '🔇 BGM';
    }

    async function playBgm() {
      if (!bgmEnabled || !sounds.bgm) return false;
      return safePlay(sounds.bgm);
    }

    async function tryIntroAudio() {
      if (introAttempted || !bgmEnabled) return;
      introAttempted = true;

      const opened = await replay(sounds.open);
      if (opened && sounds.open) {
        const waitMs = Math.min(900, Math.max(120, (sounds.open.duration || 0.45) * 1000));
        setTimeout(() => playBgm(), waitMs);
      } else {
        // 브라우저 자동재생 차단 시에는 첫 클릭 이후 BGM만 재시도합니다.
        introAttempted = false;
      }
    }

    function ensureAudioAfterGesture() {
      if (!introAttempted) {
        tryIntroAudio();
      } else {
        playBgm();
      }
    }

    function playReadySound() {
      replay(sounds.ready);
    }

    function playFinishSound() {
      if (currentHitSound) {
        try {
          currentHitSound.pause();
          currentHitSound.currentTime = 0;
        } catch (_) {}
        currentHitSound = null;
      }
      replay(sounds.finish);
    }

    function playHitSound() {
      if (!sounds.hit || !sounds.hit.length) return;
      if (currentHitSound) {
        try {
          currentHitSound.pause();
          currentHitSound.currentTime = 0;
        } catch (_) {}
      }

      currentHitSound = sounds.hit[Math.floor(Math.random() * sounds.hit.length)];
      replay(currentHitSound);
    }

    function toggleBgm() {
      bgmEnabled = !bgmEnabled;
      if (!bgmEnabled) {
        try {
          sounds.bgm.pause();
        } catch (_) {}
      } else {
        ensureAudioAfterGesture();
      }
      updateBgmButton();
    }

    function loadImage(src) {
      return new Promise(resolve => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = () => resolve(null);
        img.src = encodeURI(src);
      });
    }

    function rand(min, max) {
      return min + Math.random() * (max - min);
    }

    function clamp(v, min, max) {
      return Math.max(min, Math.min(max, v));
    }

    function sourceToCanvas(sx, sy) {
      return {
        x: char.x + (sx / SOURCE.w) * char.w,
        y: char.y + (sy / SOURCE.h) * char.h
      };
    }

    function forehead() {
      return sourceToCanvas(char.foreheadSourceX, char.foreheadSourceY);
    }

    function characterVisibleRect() {
      const b = char.visibleBBox;
      const p1 = sourceToCanvas(b.x1, b.y1);
      const p2 = sourceToCanvas(b.x2, b.y2);
      return {
        x: p1.x,
        y: p1.y,
        w: p2.x - p1.x,
        h: p2.y - p1.y
      };
    }

    function pointer(evt) {
      const rect = canvas.getBoundingClientRect();
      const t = evt.touches && evt.touches[0] ? evt.touches[0] : evt;
      return {
        x: (t.clientX - rect.left) * W / rect.width,
        y: (t.clientY - rect.top) * H / rect.height
      };
    }

    function insideCharacter(x, y) {
      const r = characterVisibleRect();
      return x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h;
    }

    function remainingSeconds() {
      if (state !== 'playing') return GAME_SECONDS;
      return clamp(GAME_SECONDS - (now - startAt) / 1000, 0, GAME_SECONDS);
    }

    function clearRound() {
      score = 0;
      projectiles.length = 0;
      debris.length = 0;
      floorLitter.length = 0;
      impactMarks.length = 0;
      hitAnimStart = -Infinity;
    }

    function beginPlaying() {
      state = 'playing';
      startAt = performance.now();
      prev = startAt;
      hide(readyOverlay);
    }

    function startGame() {
      if (state === 'ready' || state === 'playing') return;

      if (auth.loading) {
        say('치지직 로그인 상태를 확인 중입니다. 잠시 후 다시 눌러 주세요.');
        return;
      }

      if (!auth.session || !auth.user) {
        say('로그인하지 않은 상태로 플레이합니다. 이번 기록은 랭킹에 등록되지 않습니다.');
      }

      ensureAudioAfterGesture();
      clearRound();
      state = 'ready';
      hide(startOverlay);
      hide(nameOverlay);
      hide(rankOverlay);
      show(readyOverlay);
      playReadySound();

      clearTimeout(readyTimer);
      readyTimer = setTimeout(beginPlaying, 1050);
    }

    function finishGame() {
      if (state !== 'playing') return;
      state = 'ended';
      playFinishSound();
      finalScoreText.textContent = `${score}개`;
      show(nameOverlay);
      submitScoreAndShow();
    }

    function onCanvasClick(evt) {
      if (state !== 'playing') return;
      const p = pointer(evt);
      if (!insideCharacter(p.x, p.y)) return;
      launchEgg();
    }

    function launchEgg() {
      const f = forehead();
      const side = Math.random() < 0.5 ? -1 : 1;
      const startX = f.x + side * rand(450, 590);
      const startY = rand(430, 560);

      projectiles.push({
        sx: startX,
        sy: startY,
        tx: f.x + rand(-7, 7),
        ty: f.y + rand(-7, 7),
        x: startX,
        y: startY,
        t: 0,
        duration: rand(0.20, 0.32),
        arc: rand(80, 145),
        size: rand(84, 104),
        rot: rand(-0.35, 0.35),
        spin: rand(-6, 6)
      });
    }

    function hitEgg(egg) {
      score += 1;
      hitAnimStart = now;
      playHitSound();

      impactMarks.push({
        x: egg.tx,
        y: egg.ty,
        t: 0,
        life: 0.20
      });

      const common = {
        born: now,
        frontMs: 700
      };

      debris.push({
        ...common,
        type: 'top',
        x: egg.tx,
        y: egg.ty,
        vx: rand(-420, 110),
        vy: rand(-720, -420),
        rot: rand(-1.0, 1.0),
        vr: rand(-9, 9),
        size: egg.size * rand(1.02, 1.30),
        bounce: rand(0.22, 0.38),
        settled: false
      });

      debris.push({
        ...common,
        type: 'bottom',
        x: egg.tx,
        y: egg.ty,
        vx: rand(-110, 440),
        vy: rand(-680, -380),
        rot: rand(-1.0, 1.0),
        vr: rand(-9, 9),
        size: egg.size * rand(1.02, 1.30),
        bounce: rand(0.20, 0.36),
        settled: false
      });

      debris.push({
        ...common,
        type: 'peeled',
        x: egg.tx,
        y: egg.ty - 12,
        vx: rand(-350, 350),
        vy: rand(-820, -560),
        rot: rand(-0.7, 0.7),
        vr: rand(-5, 5),
        size: egg.size * rand(0.98, 1.22),
        bounce: rand(0.42, 0.62),
        settled: false,
        frameOffset: Math.floor(rand(0, PEELED_SPRITE.frames)),
        settleFrame: 0
      });

      trimActiveDebris();
    }

    function addFloorLitter(d) {
      // 바닥에 멈춘 조각은 별도 배열로 옮깁니다.
      // 이렇게 해야 80~100점 이상에서도 새로 깨지는 조각이 항상 보입니다.
      floorLitter.push({
        type: d.type,
        x: d.x,
        y: d.y,
        rot: d.rot,
        size: d.size,
        born: d.born,
        settled: true,
        settleFrame: d.settleFrame ?? 0
      });
      trimFloorLitter();
    }

    function trimFloorLitter() {
      // 오래된 바닥 껍질부터 제거합니다. 새로 깨지는 active debris에는 영향이 없습니다.
      while (floorLitter.length > MAX_FLOOR_LITTER) {
        floorLitter.shift();
      }
    }

    function trimActiveDebris() {
      if (debris.length <= MAX_ACTIVE_DEBRIS) return;

      // 비정상적으로 클릭/프레임이 몰릴 때만 오래된 active 조각을 정리합니다.
      for (let i = 0; i < debris.length && debris.length > MAX_ACTIVE_DEBRIS; ) {
        const d = debris[i];
        if (now - d.born > ACTIVE_SAFE_MS) {
          debris.splice(i, 1);
        } else {
          i += 1;
        }
      }

      // 그래도 초과하면 가장 오래된 active 조각을 제거하되, 최근 이펙트는 최대한 보존합니다.
      while (debris.length > MAX_ACTIVE_DEBRIS) {
        debris.shift();
      }
    }

    function update(dt) {
      now = performance.now();

      if (state === 'playing' && remainingSeconds() <= 0) {
        finishGame();
      }

      for (let i = projectiles.length - 1; i >= 0; i--) {
        const egg = projectiles[i];
        egg.t += dt / egg.duration;
        const t = clamp(egg.t, 0, 1);
        const ease = 1 - Math.pow(1 - t, 3);

        egg.x = egg.sx + (egg.tx - egg.sx) * ease;
        egg.y = egg.sy + (egg.ty - egg.sy) * ease - Math.sin(Math.PI * t) * egg.arc;
        egg.rot += egg.spin * dt;

        if (egg.t >= 1) {
          projectiles.splice(i, 1);
          hitEgg(egg);
        }
      }

      const gravity = 1600;

      for (let i = debris.length - 1; i >= 0; i--) {
        const d = debris[i];

        if (!d.settled) {
          d.vy += gravity * dt;
          d.x += d.vx * dt;
          d.y += d.vy * dt;
          d.rot += d.vr * dt;

          if (d.y + d.size * 0.36 >= FLOOR_Y) {
            d.y = FLOOR_Y - d.size * 0.36;
            d.vy = -Math.abs(d.vy) * d.bounce;
            d.vx *= 0.74;
            d.vr *= 0.70;

            if (Math.abs(d.vy) < 115) {
              d.settled = true;
              d.vy = 0;
              d.vx = 0;
              d.vr = 0;
              if (d.type === 'peeled') {
                d.settleFrame = (d.frameOffset + Math.floor(Math.max(0, now - d.born) / PEELED_SPRITE.frameMs)) % PEELED_SPRITE.frames;
              }
              addFloorLitter(d);
              debris.splice(i, 1);
              continue;
            }
          }
        }

        if (d.x < -260 || d.x > W + 260 || d.y > H + 260) {
          debris.splice(i, 1);
        }
      }

      trimActiveDebris();

      for (let i = impactMarks.length - 1; i >= 0; i--) {
        const b = impactMarks[i];
        b.t += dt;
        if (b.t >= b.life) impactMarks.splice(i, 1);
      }
    }

    function roundRect(x, y, w, h, r) {
      const rr = Math.min(r, w / 2, h / 2);
      ctx.beginPath();
      ctx.moveTo(x + rr, y);
      ctx.arcTo(x + w, y, x + w, y + h, rr);
      ctx.arcTo(x + w, y + h, x, y + h, rr);
      ctx.arcTo(x, y + h, x, y, rr);
      ctx.arcTo(x, y, x + w, y, rr);
      ctx.closePath();
    }

    function drawBackground() {
      ctx.clearRect(0, 0, W, H);

      const g = ctx.createLinearGradient(0, 0, W, H);
      g.addColorStop(0, '#fff0b6');
      g.addColorStop(0.42, '#ffd0a0');
      g.addColorStop(1, '#aef0db');

      ctx.fillStyle = g;
      roundRect(14, 8, W - 28, H - 22, 36);
      ctx.fill();

      ctx.save();
      ctx.globalAlpha = 0.28;
      const blobs = [
        [120, 114, 64, 42], [608, 98, 78, 36], [1100, 104, 72, 34],
        [204, 545, 82, 52], [1050, 548, 94, 58], [777, 280, 48, 30],
        [342, 176, 42, 22], [890, 242, 48, 30], [790, 654, 270, 46],
        [512, 654, 318, 58]
      ];
      for (const [x, y, rx, ry] of blobs) {
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();

      ctx.save();
      ctx.globalAlpha = 0.30;
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.ellipse(W / 2, FLOOR_Y + 16, 430, 62, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = 'rgba(120, 78, 34, .22)';
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.moveTo(70, FLOOR_Y + 6);
      ctx.bezierCurveTo(330, FLOOR_Y - 28, 850, FLOOR_Y + 46, 1210, FLOOR_Y - 4);
      ctx.stroke();
      ctx.restore();
    }

    function drawCharacter() {
      const hitAge = now - hitAnimStart;
      const hitDuration = HIT_SPRITE.frames * HIT_SPRITE.frameMs;
      const useHit = hitAge >= 0 && hitAge < hitDuration + 80 && images.hitSprite;

      ctx.save();
      ctx.imageSmoothingEnabled = true;

      if (useHit) {
        const frame = Math.min(HIT_SPRITE.frames - 1, Math.floor(hitAge / HIT_SPRITE.frameMs));
        ctx.drawImage(
          images.hitSprite,
          frame * HIT_SPRITE.frameW, 0,
          HIT_SPRITE.frameW, HIT_SPRITE.frameH,
          char.x, char.y, char.w, char.h
        );
      } else if (images.idle) {
        ctx.drawImage(images.idle, char.x, char.y, char.w, char.h);
      }

      ctx.restore();
    }

    function drawEggTexture(img, x, y, size, rot = 0) {
      if (!img) return;
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(rot);
      ctx.drawImage(img, -size / 2, -size / 2, size, size);
      ctx.restore();
    }

    function drawWholeEgg(x, y, size, rot) {
      // 두 이미지를 같은 좌표/같은 크기로 겹쳐서 유격 없이 통계란처럼 보이게 합니다.
      drawEggTexture(images.eggBottom, x, y, size, rot);
      drawEggTexture(images.eggTop, x, y, size, rot);
    }

    function drawProjectiles() {
      for (const egg of projectiles) {
        drawWholeEgg(egg.x, egg.y, egg.size, egg.rot);
      }
    }

    function drawImpactMarks() {
      ctx.save();
      for (const b of impactMarks) {
        const p = b.t / b.life;
        const r = 10 + p * 30;
        ctx.globalAlpha = 1 - p;
        ctx.strokeStyle = '#ffb13c';
        ctx.lineWidth = 5;
        ctx.beginPath();
        for (let i = 0; i < 8; i++) {
          const a = i * Math.PI / 4;
          ctx.moveTo(b.x + Math.cos(a) * r * 0.36, b.y + Math.sin(a) * r * 0.36);
          ctx.lineTo(b.x + Math.cos(a) * r, b.y + Math.sin(a) * r);
        }
        ctx.stroke();
      }
      ctx.restore();
    }

    function drawPeeledSprite(d) {
      if (!images.peeledSprite) return;
      const age = Math.max(0, now - d.born);
      const frame = d.settled
        ? (d.settleFrame ?? 0)
        : (d.frameOffset + Math.floor(age / PEELED_SPRITE.frameMs)) % PEELED_SPRITE.frames;

      ctx.save();
      ctx.translate(d.x, d.y);
      ctx.rotate(d.rot);
      ctx.drawImage(
        images.peeledSprite,
        frame * PEELED_SPRITE.frameW, 0,
        PEELED_SPRITE.frameW, PEELED_SPRITE.frameH,
        -d.size / 2, -d.size / 2,
        d.size, d.size
      );
      ctx.restore();
    }

    function drawDebrisItem(d) {
      if (d.type === 'top') drawEggTexture(images.eggTop, d.x, d.y, d.size, d.rot);
      else if (d.type === 'bottom') drawEggTexture(images.eggBottom, d.x, d.y, d.size, d.rot);
      else drawPeeledSprite(d);
    }

    function drawFloorLitter() {
      for (const d of floorLitter) {
        drawDebrisItem(d);
      }
    }

    function drawDebris(layer) {
      for (const d of debris) {
        const isFront = now - d.born < d.frontMs || !d.settled;
        if (layer === 'back' && isFront) continue;
        if (layer === 'front' && !isFront) continue;
        drawDebrisItem(d);
      }
    }

    function drawHud() {
      ctx.save();
      ctx.font = '900 30px system-ui, -apple-system, "Segoe UI", sans-serif';
      ctx.textBaseline = 'middle';

      ctx.fillStyle = 'rgba(255,255,255,.90)';
      roundRect(34, 50, 212, 62, 18);
      ctx.fill();
      ctx.fillStyle = '#332417';
      ctx.fillText(`⏱ ${remainingSeconds().toFixed(1)}초`, 80, 82);

      roundRect(1008, 120, 210, 62, 18);
      ctx.fillStyle = 'rgba(255,255,255,.90)';
      ctx.fill();
      ctx.fillStyle = '#332417';
      ctx.fillText(`🥚 ${score}개`, 1076, 152);

      ctx.restore();
    }

    function drawLoading() {
      ctx.save();
      ctx.fillStyle = 'rgba(255,255,255,.78)';
      roundRect(430, 305, 420, 96, 24);
      ctx.fill();
      ctx.fillStyle = '#392719';
      ctx.font = '900 28px system-ui, -apple-system, "Segoe UI", sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('리소스 불러오는 중...', 640, 353);
      ctx.restore();
    }

    function draw() {
      drawBackground();

      drawDebris('back');
      drawFloorLitter();
      drawCharacter();
      drawProjectiles();
      drawImpactMarks();
      drawDebris('front');

      if (state === 'loading') drawLoading();
      if (state === 'playing') drawHud();
    }

    function loop(t) {
      const dt = Math.min(0.033, (t - prev) / 1000 || 0);
      prev = t;
      update(dt);
      draw();
      requestAnimationFrame(loop);
    }

    function loginWithChzzk() {
      location.href = `${WORKER_BASE}/login`;
    }

    function logoutChzzk() {
      localStorage.removeItem(SESSION_KEY);
      auth.session = '';
      auth.user = null;
      auth.loading = false;
      updateAuthUi();
      say('로그아웃되었습니다. 로그인하지 않은 기록은 랭킹에 등록되지 않습니다.');
    }

    function getHashParams() {
      const raw = location.hash.startsWith('#') ? location.hash.slice(1) : location.hash;
      return new URLSearchParams(raw);
    }

    function consumeLoginHash() {
      const params = getHashParams();
      const session = params.get('chzzk_session');

      if (session) {
        localStorage.setItem(SESSION_KEY, session);
        auth.session = session;
        history.replaceState(null, '', location.pathname + location.search);
        return true;
      }

      const error = params.get('error');
      if (error) {
        history.replaceState(null, '', location.pathname + location.search);
        say(`치지직 로그인 실패: ${error}`);
      }

      return false;
    }

    async function workerRequest(path, options = {}) {
      const headers = new Headers(options.headers || {});
      if (!headers.has('Content-Type') && options.body) {
        headers.set('Content-Type', 'application/json');
      }

      if (auth.session) {
        headers.set('Authorization', `Bearer ${auth.session}`);
      }

      const res = await fetch(`${WORKER_BASE}${path}`, {
        ...options,
        headers
      });

      const text = await res.text();
      let data = {};
      try { data = text ? JSON.parse(text) : {}; } catch { data = { raw: text }; }

      if (!res.ok || data.ok === false) {
        const err = new Error(data.error || data.message || `Worker request failed: ${res.status}`);
        err.status = res.status;
        err.data = data;
        throw err;
      }

      return data;
    }

    function updateAuthUi() {
      if (auth.loading) {
        authStatus.textContent = '치지직 로그인 확인 중...';
        startBtn.textContent = '확인 중...';
        startBtn.disabled = true;
        loginBtn.style.display = '';
        logoutBtn.classList.add('hidden');
        return;
      }

      startBtn.disabled = false;
      startBtn.textContent = '게임 시작';

      if (auth.user) {
        authStatus.textContent = `${auth.user.channelName}님으로 로그인됨 · 랭킹 등록 가능`;
        loginBtn.textContent = '다른 계정으로 로그인';
        loginBtn.style.display = '';
        logoutBtn.classList.remove('hidden');
      } else {
        authStatus.textContent = '로그인하지 않아도 플레이할 수 있습니다. 단, 로그인하지 않을 시 랭킹이 등록되지 않습니다.';
        loginBtn.textContent = '치지직 로그인';
        loginBtn.style.display = '';
        logoutBtn.classList.add('hidden');
      }
    }

    async function initChzzkAuth() {
      auth.loading = true;
      consumeLoginHash();

      if (!auth.session) {
        auth.session = localStorage.getItem(SESSION_KEY) || '';
      }

      if (!auth.session) {
        auth.user = null;
        auth.loading = false;
        updateAuthUi();
        return;
      }

      try {
        const data = await workerRequest('/me');
        auth.user = data.user;
      } catch (err) {
        console.warn('[chzzk session invalid]', err);
        localStorage.removeItem(SESSION_KEY);
        auth.session = '';
        auth.user = null;
      } finally {
        auth.loading = false;
        updateAuthUi();
      }
    }

    async function fetchRanks() {
      const data = await workerRequest('/rankings');
      return (data.rankings || [])
        .map((r, index) => ({
          id: `${r.chzzkChannelId || r.name}-${r.createdAt || index}`,
          name: r.name || '이름 없음',
          chzzkChannelId: r.chzzkChannelId || '',
          score: Number(r.score || 0),
          createdAt: r.createdAt || ''
        }))
        .sort((a, b) => b.score - a.score || String(a.createdAt).localeCompare(String(b.createdAt)))
        .slice(0, 10);
    }

    async function renderRanks() {
      rankList.innerHTML = '';

      let ranks;
      try {
        ranks = await fetchRanks();
      } catch (err) {
        console.error('[rank load failed]', err);
        const li = document.createElement('li');
        li.style.gridTemplateColumns = '1fr';
        li.textContent = '랭킹을 불러오지 못했습니다. Worker와 Firebase 설정을 확인해 주세요.';
        rankList.appendChild(li);
        return;
      }

      if (!ranks.length) {
        const li = document.createElement('li');
        li.style.gridTemplateColumns = '1fr';
        li.textContent = '아직 등록된 기록이 없습니다.';
        rankList.appendChild(li);
        return;
      }

      ranks.forEach((r, i) => {
        const li = document.createElement('li');
        if (auth.user && r.chzzkChannelId === auth.user.channelId && r.score === lastSavedId) {
          li.classList.add('me');
        }
        li.innerHTML = `<span>${i + 1}위</span><span></span><strong>${r.score}개</strong>`;
        li.children[1].textContent = r.name;
        rankList.appendChild(li);
      });
    }

    async function submitScoreAndShow() {
      if (!auth.session || !auth.user) {
        submitStatus.textContent = '로그인하지 않은 상태로 플레이하여 이번 기록은 랭킹에 등록되지 않습니다.';
        saveRankBtn.textContent = '랭킹 보기';
        saveRankBtn.disabled = false;
        saveRankBtn.onclick = async () => {
          hide(nameOverlay);
          show(rankOverlay);
          await renderRanks();
        };
        say('로그인하지 않을 시 랭킹이 등록되지 않습니다.');
        return;
      }

      submitStatus.textContent = `${auth.user.channelName}님 기록을 등록 중...`;
      saveRankBtn.disabled = true;
      saveRankBtn.textContent = '등록 중...';

      try {
        const data = await workerRequest('/submit-score', {
          method: 'POST',
          body: JSON.stringify({ score, duration: GAME_SECONDS })
        });

        lastSavedId = score;

        hide(nameOverlay);
        show(rankOverlay);

        rankList.innerHTML = '';
        const ranks = data.rankings || [];
        if (!ranks.length) {
          await renderRanks();
        } else {
          ranks.forEach((r, i) => {
            const li = document.createElement('li');
            if (auth.user && r.chzzkChannelId === auth.user.channelId && Number(r.score || 0) === score) {
              li.classList.add('me');
            }
            li.innerHTML = `<span>${i + 1}위</span><span></span><strong>${Number(r.score || 0)}개</strong>`;
            li.children[1].textContent = r.name || '이름 없음';
            rankList.appendChild(li);
          });
        }

        say('치지직 랭킹 등록 완료!');
      } catch (err) {
        console.error('[submit score failed]', err);
        submitStatus.textContent = '랭킹 등록에 실패했습니다. 잠시 후 다시 시도해 주세요.';
        saveRankBtn.textContent = '다시 등록 시도';
        saveRankBtn.disabled = false;
        saveRankBtn.onclick = submitScoreAndShow;

        if (err.status === 401) {
          localStorage.removeItem(SESSION_KEY);
          auth.session = '';
          auth.user = null;
          updateAuthUi();
          submitStatus.textContent = '로그인이 만료되었습니다. 다시 로그인해 주세요.';
          saveRankBtn.textContent = '치지직 로그인';
          saveRankBtn.onclick = loginWithChzzk;
        }

        say('랭킹 등록 실패');
      }
    }

    async function init() {
      setupAudio();
      updateBgmButton();

      const entries = await Promise.all(
        Object.entries(paths).map(async ([key, src]) => [key, await loadImage(src)])
      );

      for (const [key, img] of entries) images[key] = img;

      state = 'start';
      await initChzzkAuth();
      hide(toast);

      // 브라우저가 허용하면 페이지 오픈 시 카캇 → BGM 순서로 재생합니다.
      // 자동재생이 차단되면 첫 클릭/터치 이후에 다시 시도합니다.
      setTimeout(tryIntroAudio, 120);
    }

    canvas.addEventListener('click', onCanvasClick);
    canvas.addEventListener('touchstart', (evt) => {
      evt.preventDefault();
      onCanvasClick(evt);
    }, { passive: false });

    startBtn.addEventListener('click', startGame);
    loginBtn.addEventListener('click', loginWithChzzk);
    logoutBtn.addEventListener('click', logoutChzzk);
    bgmToggle.addEventListener('click', toggleBgm);
    window.addEventListener('pointerdown', ensureAudioAfterGesture, { once: true });
    window.addEventListener('keydown', ensureAudioAfterGesture, { once: true });
    againBtn.addEventListener('click', () => {
      hide(rankOverlay);
      hide(readyOverlay);
      show(startOverlay);
      state = 'start';
      clearTimeout(readyTimer);
      clearRound();
      updateAuthUi();
    });
    refreshRankBtn.addEventListener('click', renderRanks);
    saveRankBtn.addEventListener('click', submitScoreAndShow);

    requestAnimationFrame(loop);
    init();
  </script>
</body>
